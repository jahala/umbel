# The prompt lands, or the send fails

**Goal.** A worker is ready when its input line is idle and nothing is still arriving, and a prompt is sent when the worker has taken it. `spawn` declares codex ready only once the idle prompt line is on the pane, no startup dialog is pending and the pane has settled; dialogs that appear late are still dismissed. `send` confirms the turn started — while the pasted prompt still sits in the input box after the submitting Enter, Enter is sent again, a bounded number of times — and fails with a typed error carrying the pane when it never lands, so no conductor waits thirty minutes on a turn that never began.

jahala/umbel#77. On 2026-09-10 a codex 0.154.0 auditor under pleach received its prompt as a paste and never ran it: ten minutes later the pane still showed `› [Pasted Content 1125 chars]`, no turn, no stop hook. Recorded through umbel on 2026-09-11 (`.loop-scratch` captures, to become the fixture): `spawn` returns 1.1 s after launch, on the first banner frame with `model: loading`; the banner re-renders twice more over the next three seconds, the usage-limit line (`You have 3 usage limit resets available`) arrives two seconds in, and on one launch the workspace-trust dialog (`Do you trust the contents of this directory? › 1. Yes, continue`) appeared after the banner — after `readyMatch` had fired and the dialog loop had returned — and stayed on the pane. A prompt pasted into that window is typed onto a screen that is still being built.

## How

Ready means idle and settled. codex's `readyMatch` becomes the idle prompt line (`› Ask Codex to do anything`, or the older `Implement {`), and the provider declares `readySettleMs` (codex: 1500). `dismissStartupDialogs` returns only when `readyMatch` holds, no dialog is pending, and the pane has not changed for the settle window — dismissing any dialog that appears meanwhile. The recorded 0.154.0 frames are a fixture the unit test replays through the tmux dependency. The fakes print their provider's ready line at start, and the dialog loop runs for fakes too, so the e2e path is the real startup path.

Send confirms. After the submitting Enter, `send` re-reads the pane; while the provider's `pendingInputMatch` (codex: `[Pasted Content N chars]`) still matches after a short grace, it sends Enter again, at most three times. If the prompt is still pending after the bound, `send` throws `SendNotSubmittedError` (session, pane snapshot), mapped to exit 1 with the pending input line in the message; nothing further is typed. Providers that declare no `pendingInputMatch` are unchanged.

The fake grows the race. `fake-codex.sh` takes `FAKE_CODEX_SWALLOW_ENTERS=N` (print `› [Pasted Content N chars]` and require N further Enters before the turn runs) and `FAKE_CODEX_STARTUP=0154` (render the recorded sequence: banner, the usage line a second later, the trust dialog a second after that, idle prompt on Enter).
