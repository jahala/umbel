# umbel — the project loop

**Goal.** umbel is the reliable execution boundary for one unit of agent work: a conductor hands it a task for any provider (claude, codex, gemini, opencode) and gets back a result it can branch on — the worker's own words, its actions, its diff, or a typed reason it did not finish. The caller owns the graph; umbel owns transport, completion detection, liveness, output parsing and provider quirks, so that a conductor such as pleach can be pure control flow over trustworthy units. Every unit is honest about its end: a worker that died, wedged, never started its turn, or was told to leave leaves evidence a post-mortem can read without spawning another.

This map is the tier-one order of 2026-09-12 from the umbrella (jahala/plotplot): the defects pleach hit while conducting real builds through umbel, one loop per issue, shaped checks-first and built by pleach driving umbel — umbel building umbel is the dogfood.
