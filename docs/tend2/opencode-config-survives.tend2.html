# The user's opencode config survives a spawn

**Goal.** A spawn with the opencode provider reads the user's `opencode.jsonc` as what its name says — JSONC, with comments and trailing commas — and edits it in place, preserving every byte it does not own. A file that does not parse refuses the spawn, naming the file, line and column, and is left byte-identical. A file that already carries the plugin entry is not written at all. A `--model` that opencode does not list refuses the spawn before a worker exists, so a request for a free local model can never silently become a paid remote one.

jahala/umbel#53. Today `installGlobalPlugin` parses the file with `JSON.parse` inside a try; a single `//` comment takes the catch branch, the config becomes `{}`, and the file is rewritten with nothing but `$schema` and `plugin`. Provider blocks, model definitions and every other setting are gone without an error, a warning or a backup. The worker then binds to whatever provider opencode falls back to, with whatever credential the inherited environment carries.

## How

JSONC in, the same JSONC out. `mergeOpencodePluginConfig` parses with `jsonc-parser` (Microsoft's JSONC implementation, the one VS Code uses; a new dependency, listed in CLAUDE.md's Stack line) and inserts the plugin path with `modify` + `applyEdits`, so comments, key order and formatting survive and the Case B reformatting churn goes away. A file that already lists the path is returned as-is and not written. A file with a syntax error is reported as unparsable with its line and column; the pure function never replaces it.

Refusal is a typed error. `OpencodeConfigUnparsableError` (file, line, column, reason) in `src/core/errors.ts` is thrown by the adapter and mapped to exit 1 at the face; the spawn stops before tmux is touched. `OpencodeModelUnknownError` (model, the listed ids) is thrown by `spawn` after consulting `opencode models` — one `provider/model` id per line, about half a second on the real binary — and mapped to exit 2 like an unknown provider. The probe runs the same binary the launch will use (the `claudeBin` override, which the CLI takes from `UMBEL_CLAUDE_BIN` for every provider), so the fake binary answers it in tests.

The fake grows the `models` verb. `test/fixtures/fake-opencode.sh models` prints a fixed list, so integration and e2e tests exercise the check without the real binary; the smoke suite is not touched.
