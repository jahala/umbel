# A dead worker leaves its evidence

**Goal.** A worker that dies leaves what a post-mortem needs, without anyone spawning another to watch. Its tmux pane outlives its process, so umbel reads the exact last screen and the exit status from the pane itself; `wait` settles `dead` with both and writes them into the session directory; `capture`, `logs`, `actions` and `read` keep answering for a dead session; `kill` leaves the directory as a tombstone unless told to purge, and `prune` sweeps tombstones. A conductor that kills on failure no longer erases the only record of why.

jahala/umbel#73. On 2026-09-05 a worker died and `capture` said no server was running, `read` said the transcript path was unresolved, `logs` was empty; the only way to learn the cause was a second spawn watched by hand. On 2026-09-08 two codex workers were killed by another agent mid-`apply_patch`; pleach settled the node dead and terminated the sessions, and afterwards their `~/.umbel/sessions/<name>/` directories were gone, `logs` and `actions` had nothing and `ls` no longer listed them. #63 gave `wait` a periodic pane snapshot from while the worker was alive, at most a couple of seconds behind the death; the exit status, the exact final screen and anything after `kill` are still lost.

## How

The pane outlives the process. `newSession` sets `remain-on-exit` on the session, so when the worker's process exits the pane stays with `#{pane_dead}` set and `#{pane_dead_status}` holding the exit status. Liveness moves from `has-session` to a `paneState` read (`display-message -p '#{pane_dead} #{pane_dead_status}'`): `spawn`'s startup check, `wait`'s liveness probe and `status`'s `alive` all use it, so a session that exists with a dead pane is dead. The capture at death is exact, because the pane is still there to capture.

Death is written down. When `wait` finds the pane dead it settles `dead` with `exitCode`, a `message` naming the exit status (the runner contract, `contracts/runner.md` on jahala/plotplot: no non-progress reason without what was observed; the reason and its exit code 125 are unchanged) and `paneSnapshot` from the dead pane and writes `events/dead` — `{at, exitCode, paneSnapshot}` — into the session directory; `status` and `ls` show `dead (exit N)`. `kill` captures the pane before tearing the session down and writes `events/dead` with `by: 'kill'`; the directory stays. `kill --purge` removes it, and `umbel prune [--older-than DURATION]` removes dead sessions' directories and their tmux remains, never a live session. `capture` answers from the pane while it remains and from `events/dead` once it is gone; `logs`, `actions` and `read` answer from the kept events and the transcript path when it was recorded.

The fake grows a death. `fake-claude.sh` takes `FAKE_CLAUDE_DIE_MS` and `FAKE_CLAUDE_EXIT_CODE`: mid-turn it prints a last line, sleeps that long and exits with that status, so integration and e2e tests see a real death with a real pane.

The record is umbel's own, not tmux's. `spawn` launches the worker through a small wrapper script umbel installs beside its hooks (`<state>/hooks/exec.sh`): it runs the worker's argv, and at the moment the process ends — by exit or by signal, the wrapper trapping its own — it writes `events/exit` (`{exitCode}` or `{signal}`, the signal by name) into the session directory, then ends with the same status. The dead path reads that record first; tmux's `pane_dead_status` and `pane_dead_signal` are the fallback when the record is absent, never the source, so no tmux version is special-cased. Ruled by the umbrella on 2026-09-16 after ubuntu's tmux 3.4 recorded no status for a worker that had exited 3 (jahala/umbel#91).
