name: Bug report
description: Something umbel does wrong, or differently than the docs say.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did umbel do, and what did you expect instead?
      placeholder: |
        Expected: ...
        Actual:   ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps or commands. A short repo or a paste is fine.
      placeholder: |
        1. `umbel foo --bar`
        2. Look at the output
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: umbel version
      placeholder: "Output of `umbel --version`"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15.3, Bun 1.2, tmux 3.5, Claude CLI 1.x — whatever is relevant"
    validations:
      required: false
