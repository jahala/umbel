name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Fail fast if package.json version doesn't match the tag
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
        with:
          # Pinned: `latest` is non-reproducible and silently drifted CI into a break.
          bun-version: "1.3.14"
          # Disabled: setup-bun's cache restored a stale node_modules on ubuntu-latest
          # that bun couldn't open ("could not open node_modules" / mkdir "File exists").
          no-cache: true

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VER=$(bun -e "console.log(require('./package.json').version)")
          echo "Tag: $TAG  package.json: $PKG_VER"
          if [ "$PKG_VER" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VER) does not match tag ($TAG)"
            exit 1
          fi

  build:
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: write # softprops/action-gh-release uploads release assets
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
        with:
          # Pinned: `latest` is non-reproducible and silently drifted CI into a break.
          bun-version: "1.3.14"
          # Disabled: setup-bun's cache restored a stale node_modules on ubuntu-latest
          # that bun couldn't open ("could not open node_modules" / mkdir "File exists").
          no-cache: true

      # The current ubuntu-latest image won't let bun 1.3.14 create node_modules
      # ("could not open node_modules"). With the cache off (above) it's a clean
      # dir — pre-create it so bun can open it, then --frozen-lockfile installs.
      - run: mkdir -p node_modules && bun install --frozen-lockfile

      - name: Build all targets
        run: bun run scripts/build.ts --all

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # ratchet:softprops/action-gh-release@v3
        with:
          files: dist/rctrl-*
          generate_release_notes: true
