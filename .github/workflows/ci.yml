name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2
        with:
          # Pinned: `latest` is non-reproducible and silently drifted CI into a break.
          bun-version: "1.3.14"
          # Disabled: setup-bun's cache restored a stale node_modules on ubuntu-latest
          # that bun couldn't open ("could not open node_modules" / mkdir "File exists").
          # Installing fresh each run is fast (~100ms for this dep set) and reproducible.
          no-cache: true

      - name: Install tmux
        run: sudo apt-get install -y tmux

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run lint

      - run: bun test
